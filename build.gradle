plugins {
    id 'application'
    id 'java'
}

repositories {
    google()
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

base {
    archivesName = 'StoneDetector'
}

dependencies {
    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'org.apache.commons:commons-configuration2:2.15.1'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'org.slf4j:slf4j-simple:2.0.18'
    implementation 'fr.inria.gforge.spoon:spoon-core:11.4.0'
    implementation 'org.jgrapht:jgrapht-ext:1.5.3'
    implementation 'org.soot-oss:soot:4.7.1'
    implementation 'guru.nidi:graphviz-java:0.18.1'
    testImplementation platform('org.junit:junit-bom:6.1.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets {
    main {
        java {
            // StoneDetector historically vendored Spoon 8.2. Use the maintained
            // dependency so the parser tracks current Java syntax.
            exclude 'spoon/**'
        }
    }
}

application {
    mainClass = project.findProperty('mainClass') ?: 'org.dlr.foobar.SpoonDriver'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes(
        'Multi-Release': 'true'
    )
    doFirst {
        from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
    manifest {
        attributes 'Main-Class': 'org.dlr.foobar.SpoonBigCloneBenchDriver'
    }
}
